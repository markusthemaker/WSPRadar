name: Deploy published website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate the publication root
    if: github.repository == 'markusthemaker/WSPRadar' && github.repository_id == '1416038123' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out published files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify publication root and custom domain
        shell: bash
        run: |
          set -euo pipefail
          test -s ci-published/index.html
          test -f ci-published/.nojekyll
          test "$(cat ci-published/CNAME)" = 'www.wspradar.org'
          test -z "$(find ci-published -type l -print -quit)"
          test ! -e ci-published/.git
          test ! -e ci-published/.github
      - name: Upload the published website only
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ci-published
          include-hidden-files: true

  deploy:
    name: Deploy to www.wspradar.org
    needs: validate
    if: github.repository == 'markusthemaker/WSPRadar' && github.repository_id == '1416038123' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require the current main revision and approved Pages settings
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$current_head" = "$GITHUB_SHA" || { echo 'main changed; deploy its newer publication.' >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/pages" --jq '
            if .build_type == "workflow" and
               .cname == "www.wspradar.org" and
               .https_enforced == true
            then "Pages uses GitHub Actions, www.wspradar.org, and enforced HTTPS."
            else error("Pages settings differ from the approved production configuration.")
            end'
      - name: Read Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      - name: Deploy the published website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
